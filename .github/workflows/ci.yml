name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The Rust side. `generate_context!` embeds the frontend at compile time, so
  # dist/ has to exist before cargo runs. dist/ is gitignored, so the frontend is
  # built per job rather than restored from an artifact.
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable

      # Cargo layer caching, kept separate from the frontend build so a frontend
      # change does not invalidate the Rust cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/slicer -> target

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: app
        run: pnpm build

      - name: cargo check (app)
        working-directory: app/src-tauri
        run: cargo check --release --features custom-protocol --locked

      - name: cargo test (app)
        working-directory: app/src-tauri
        run: cargo test --release --features custom-protocol --locked

      - name: slicer self-test
        run: |
          cargo build --release --locked --manifest-path tools/slicer/Cargo.toml
          tools/slicer/target/release/slicer --selftest

  # Full bundles, to prove packaging works and the icon formats resolve. Linux is
  # included deliberately: it is the only platform that actually works today, so
  # its packaging is the one most worth catching before a release.
  bundle:
    name: bundle (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            build-essential \
            fakeroot \
            dpkg-dev \
            rpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Bundle
        working-directory: app
        run: pnpm tauri build --ci

      - uses: actions/upload-artifact@v4
        with:
          name: thockboard-${{ matrix.os }}
          path: |
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.AppImage
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14
