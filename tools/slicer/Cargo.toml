[package]
name = "slicer"
version = "0.1.0"
edition = "2021"
description = "Turns long CC0 keyboard recordings into short, normalised single-strike assets."

[dependencies]
symphonia = { version = "0.5", default-features = false, features = [
  "wav", "ogg", "pcm", "mp3", "flac", "vorbis", "aac", "adpcm",
] }
hound = "3.5"
serde_json = "1"

[profile.release]
opt-level = 3
